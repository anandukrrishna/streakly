<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Reference 1: Obsidian Sculptural Base with Deep Charcoal Gradients -->
    <linearGradient id="obsidianBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161B" />
      <stop offset="45%" stop-color="#0A0B0E" />
      <stop offset="100%" stop-color="#020304" />
    </linearGradient>

    <!-- Reference 1: Directional Fine Silver Rim / Bevel Reflection -->
    <linearGradient id="silverRimBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.75)" />
      <stop offset="25%" stop-color="rgba(200, 210, 225, 0.35)" />
      <stop offset="65%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.2)" />
    </linearGradient>

    <!-- Reference 2: Translucent Liquid Glass Diffusion Body -->
    <linearGradient id="liquidGlassBody" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.65)" />
      <stop offset="20%" stop-color="rgba(235, 242, 255, 0.35)" />
      <stop offset="50%" stop-color="rgba(190, 205, 225, 0.12)" />
      <stop offset="80%" stop-color="rgba(220, 230, 245, 0.22)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.45)" />
    </linearGradient>

    <!-- Inner Core Refraction / Caustic Highlight -->
    <linearGradient id="causticInnerCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.9)" />
      <stop offset="50%" stop-color="rgba(215, 230, 250, 0.4)" />
      <stop offset="100%" stop-color="rgba(160, 180, 205, 0.15)" />
    </linearGradient>

    <!-- Subtle Sculpted Depth Shadow -->
    <filter id="glassDepthShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="rgba(0, 0, 0, 0.85)" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(255, 255, 255, 0.25)" />
    </filter>
  </defs>

  <!-- Obsidian Base Squircle with Continuous Curvature -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#obsidianBase)" stroke="url(#silverRimBevel)" stroke-width="1.2" />

  <!-- Soft Ambient Sculptural Underglow (Directional Silver-White) -->
  <ellipse cx="50" cy="58" rx="26" ry="24" fill="rgba(255, 255, 255, 0.04)" />

  <!-- Outer Sculpted Flame Silhouette (Translucent Liquid Glass Body) -->
  <path d="M 50 16 C 52 26, 69 39, 69 57 C 69 72, 59 84, 50 84 C 41 84, 31 72, 31 57 C 31 39, 48 26, 50 16 Z"
        fill="url(#liquidGlassBody)"
        stroke="rgba(255, 255, 255, 0.4)"
        stroke-width="1"
        filter="url(#glassDepthShadow)" />

  <!-- Refraction Caustic Wing (Liquid Glass Internal Surface) -->
  <path d="M 50 18 C 50 18, 35 34, 35 52 C 35 65, 42 75, 50 80 C 40 73, 38 61, 43 49 C 45 44, 48 37, 50 18 Z"
        fill="rgba(255, 255, 255, 0.2)" />

  <!-- Inner Sculpted Core Flame -->
  <path d="M 50 34 C 51 41, 60 48, 60 59 C 60 68, 55 75, 50 76 C 45 75, 40 68, 40 59 C 40 48, 49 41, 50 34 Z"
        fill="url(#causticInnerCore)"
        stroke="rgba(255, 255, 255, 0.35)"
        stroke-width="0.8" />

  <!-- Delicate Upper-Edge Highlight (Direct Light Reflection) -->
  <path d="M 50 19 C 51 24, 53 28, 55 33 C 52 30, 48 24, 50 19 Z"
        fill="#FFFFFF" opacity="0.95" />

  <!-- Glass Top Bevel Reflection Strip -->
  <ellipse cx="50" cy="27" rx="10" ry="3" fill="rgba(255, 255, 255, 0.3)" />
</svg>