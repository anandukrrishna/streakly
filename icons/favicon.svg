<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Obsidian Squircle Gradient -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="50%" stop-color="#0E1015" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Squircle Specular Rim -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.6)" />
    </linearGradient>

    <!-- Flame Core Ambient Glow -->
    <radialGradient id="flameAmbient" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.35)" />
      <stop offset="60%" stop-color="rgba(139, 92, 246, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <!-- Outer Glass Flame Prism -->
    <linearGradient id="outerFlameGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="25%" stop-color="rgba(196, 220, 255, 0.85)" />
      <stop offset="55%" stop-color="rgba(139, 92, 246, 0.75)" />
      <stop offset="85%" stop-color="rgba(59, 130, 246, 0.9)" />
      <stop offset="100%" stop-color="rgba(46, 184, 114, 0.85)" />
    </linearGradient>

    <!-- Inner Flame Specular Core -->
    <linearGradient id="innerCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#93C5FD" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2EB872" />
    </linearGradient>

    <!-- Drop Shadow Filter for Sculpted Depth -->
    <filter id="flameDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="rgba(0, 0, 0, 0.7)" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(59, 130, 246, 0.4)" />
    </filter>
  </defs>

  <!-- Obsidian Glass Base Squircle with Apple Continuous Corner Radius -->
  <rect x="2" y="2" width="96" height="96" rx="25" fill="url(#obsidianBg)" stroke="url(#specularRim)" stroke-width="1.2" />

  <!-- Internal Ambient Glow -->
  <circle cx="50" cy="58" r="32" fill="url(#flameAmbient)" />

  <!-- Outer Sculpted Glass Flame Wing (Left Refraction) -->
  <path d="M 50 16 C 50 16, 32 34, 32 53 C 32 67, 40 76, 50 82 C 38 75, 36 62, 42 50 C 44 45, 48 38, 50 16 Z"
        fill="rgba(255, 255, 255, 0.28)" />

  <!-- Main Sculpted Obsidian Glass Flame Body -->
  <path d="M 50 16 C 52 26, 68 38, 68 56 C 68 71, 58 83, 50 84 C 42 83, 32 71, 32 56 C 32 38, 48 26, 50 16 Z"
        fill="url(#outerFlameGrad)" filter="url(#flameDepth)" />

  <!-- Inner Concentric Sculpted Core (Discipline & Momentum) -->
  <path d="M 50 34 C 51 40, 60 48, 60 59 C 60 69, 54 75, 50 76 C 46 75, 40 69, 40 59 C 40 48, 49 40, 50 34 Z"
        fill="url(#innerCoreGrad)" />

  <!-- Specular Top Apex Light Highlight -->
  <path d="M 50 20 C 51 25, 54 30, 56 36 C 52 32, 48 26, 50 20 Z"
        fill="#FFFFFF" opacity="0.9" />

  <!-- Top Glass Sheen Edge -->
  <ellipse cx="50" cy="28" rx="14" ry="4" fill="rgba(255, 255, 255, 0.35)" filter="blur(1px)" />
</svg>
